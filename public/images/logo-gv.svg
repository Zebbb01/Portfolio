<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none">
  <!--
    Gerald Villaceran — Personal Brand Logo
    Style: Combination mark (monogram + wordmark)
    Font: Outfit (consistent with site heading font)
    
    GV Monogram: The G's curve shares its right stem with V's left stroke,
    creating one continuous flowing mark. Represents unity of design + engineering.
  -->
  
  <!-- GV Monogram — interlinked letterforms -->
  <g transform="translate(0, 4)">
    <!-- G: Open arc with horizontal bar -->
    <path 
      d="M22 6C14.3 6 4 12.5 4 24C4 35.5 12.5 42 22 42C28 42 32 39.5 34 37L34 26H24.5"
      stroke="#D4AF37" 
      stroke-width="2.5" 
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- V: Flows into angular downstroke -->
    <path 
      d="M34 14L42 38L50 14"
      stroke="#D4AF37" 
      stroke-width="2.5" 
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
  
  <!-- Divider line -->
  <line x1="62" y1="14" x2="62" y2="42" stroke="#D4AF37" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Wordmark: GERALD — light weight, gold, wide tracking -->
  <text 
    x="72" y="27" 
    font-family="'Outfit', system-ui, sans-serif" 
    font-weight="300" 
    font-size="11" 
    fill="#D4AF37" 
    letter-spacing="3.5"
  >GERALD</text>
  
  <!-- Wordmark: VILLACERAN — bold, ivory, tighter tracking -->
  <text 
    x="72" y="43" 
    font-family="'Outfit', system-ui, sans-serif" 
    font-weight="700" 
    font-size="13" 
    fill="#F5F0E8" 
    letter-spacing="2.5"
  >VILLACERAN</text>
</svg>
